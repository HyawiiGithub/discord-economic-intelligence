name = "economy-discord-login"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
DISCORD_CLIENT_ID = "REPLACE_WITH_DISCORD_APPLICATION_ID"
DISCORD_REDIRECT_URI = "https://REPLACE_WITH_WORKER_HOSTNAME/callback"
DASHBOARD_URL = "https://REPLACE_WITH_PAGES_URL"

# Set these as encrypted Worker secrets with `wrangler secret put`:
# DISCORD_CLIENT_SECRET
# SESSION_SECRET
